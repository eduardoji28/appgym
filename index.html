<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>appgym</title>
  </head>
  <body>
    <main id="app">
      <h1>appgym</h1>
      <p id="today"></p>
      <p id="status" role="status"></p>
      <ol id="week" aria-label="Semana actual"></ol>
      <p id="streak"></p>
      <button id="register" type="button">Fui hoy</button>
      <form id="past">
        <label for="past-date">¿Se te pasó un día?</label>
        <input id="past-date" type="date" />
        <button type="submit">Marcar día</button>
        <p id="past-status" role="status"></p>
      </form>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
